name: gitleaks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          chmod +x gitleaks
      - name: Scan for secrets
        run: |
          ./gitleaks detect --source . --report-format json \
            --report-path /tmp/gitleaks-report.json --redact --exit-code 0
          python3 scripts/check-gitleaks-baseline.py /tmp/gitleaks-report.json
