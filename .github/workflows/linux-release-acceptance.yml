name: Signed release lifecycle and network acceptance

on:
  pull_request:
    paths:
      - 'packaging/linux/**'
      - '.github/workflows/linux-release-acceptance.yml'
  workflow_dispatch:
    inputs:
      older_tag:
        default: v0.16.0
        required: true
        type: string
      older_run:
        default: '40457208975'
        required: true
        type: string
      newer_tag:
        description: Second immutable signed release tag (empty runs network only)
        type: string
      newer_run:
        description: Successful production release workflow run for newer_tag
        type: string

permissions:
  contents: read
  actions: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OLDER_TAG: ${{ inputs.older_tag || 'v0.16.0' }}
      OLDER_RUN: ${{ inputs.older_run || '40457208975' }}
      NEWER_TAG: ${{ inputs.newer_tag }}
      NEWER_RUN: ${{ inputs.newer_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Fetch exact successful production runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/linux/fetch-release-ci.py "$OLDER_TAG" "$OLDER_RUN" "$RUNNER_TEMP/assets/older"
          if [[ -n "$NEWER_TAG" ]]; then
            python3 packaging/linux/fetch-release-ci.py "$NEWER_TAG" "$NEWER_RUN" "$RUNNER_TEMP/assets/newer"
          else
            test -z "$NEWER_RUN"
          fi
      - name: Prepare disposable Linux host
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables sudo python3 curl openssl
          for directory in / /usr /usr/local /usr/local/bin /usr/local/lib /opt; do
            test ! -L "$directory"
            test -d "$directory"
          done
          for directory in /usr/local /usr/local/bin /usr/local/lib /opt; do
            sudo chown root:root "$directory"
            sudo chmod go-w "$directory"
          done
      - name: Authenticate and install original release
        run: |
          sudo env -i GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /usr/bin/python3 packaging/linux/provision-release-ci.py \
            "$RUNNER_TEMP/assets/older" "$(command -v cosign)" "$OLDER_TAG"
      - name: Original installed release network proof
        run: |
          sudo env -i GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/python3 packaging/linux/network-acceptance.py nocklock-candidate "$RUNNER_TEMP/evidence/older-network"
      - name: Signed cross-version lifecycle
        if: inputs.newer_tag != ''
        run: |
          sudo env -i GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /usr/bin/python3 packaging/linux/cross-version-ci.py \
            "$RUNNER_TEMP/assets/older" "$RUNNER_TEMP/assets/newer" "$(command -v cosign)" \
            "$RUNNER_TEMP/evidence/cross-version" "$OLDER_TAG" "$NEWER_TAG"
      - name: Upgraded installed release network proof
        if: inputs.newer_tag != ''
        run: |
          sudo env -i GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/python3 packaging/linux/network-acceptance.py nocklock-candidate "$RUNNER_TEMP/evidence/newer-network"
      - name: Collect public evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          sudo cp "$RUNNER_TEMP/assets/"*-source.json "$RUNNER_TEMP/evidence/"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: signed-linux-release-acceptance
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 90

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [older, newer]
    # A network-only run has just the older version.
    env:
      RELEASE_TAG: ${{ matrix.version == 'newer' && inputs.newer_tag || inputs.older_tag || 'v0.16.0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: release-source/go.mod
          cache: false
      - name: Install exact tagged macOS source build
        run: |
          make -C release-source build VERSION="${RELEASE_TAG#v}"
          sudo install -m 0755 release-source/nocklock /usr/local/bin/nocklock
      - name: Installed macOS proxy and direct-egress proof
        run: |
          sudo env -i GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            /usr/bin/python3 packaging/linux/network-acceptance.py "$(id -un)" "$RUNNER_TEMP/evidence"
      - name: Collect public evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence"
          git -C release-source rev-parse HEAD > "$RUNNER_TEMP/evidence/source.txt"
          shasum -a 256 /usr/local/bin/nocklock > "$RUNNER_TEMP/evidence/binary.sha256"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-release-network-${{ matrix.version }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 90
