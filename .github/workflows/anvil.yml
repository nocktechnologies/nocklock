name: Anvil (Codex Security Review)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write

jobs:
  anvil-review:
    # This workflow must come from the base branch: fork PRs can edit their
    # own workflow file, so a pull_request job-level gate can be removed.
    # The public-repo exception remains limited to the exact fleet bot on a
    # same-repo head.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.login == 'nock-fleet[bot]' ||
        (
          github.event.repository.private == true &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        )
      )
    runs-on:
      group: nocklock-anvil
      labels: [self-hosted, macOS, ARM64, codex-signed]
    timeout-minutes: 25

    steps:
      - name: Reclaim stale Anvil Codex copies
        run: |
          # Includes per-run output directories left by interrupted reviews.
          for stale_dir in "${RUNNER_TEMP}"/anvil-codex.*; do
            [[ -d "${stale_dir}" && ! -L "${stale_dir}" ]] || continue
            echo "::warning::Removing stale Anvil Codex copy: ${stale_dir}"
            chflags -R nouchg "${stale_dir}" 2>/dev/null || true
            chmod -RN "${stale_dir}" 2>/dev/null || true
            chmod -R u+rwX "${stale_dir}" 2>/dev/null || true
            if ! rm -rf "${stale_dir}" || [[ -e "${stale_dir}" ]]; then
              echo "::error::Anvil runner could not remove a stale Codex copy; skipping the review."
              exit 1
            fi
          done

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Record shared Codex auth guard
        id: shared-codex-auth
        run: |
          SHARED_AUTH_FILE="${HOME}/.codex/auth.json"
          if [[ -f "${SHARED_AUTH_FILE}" ]]; then
            echo "auth_present=true" >> "$GITHUB_OUTPUT"
            shasum -a 256 "${SHARED_AUTH_FILE}" | awk '{print "auth_sha="$1}' >> "$GITHUB_OUTPUT"
          else
            echo "auth_present=false" >> "$GITHUB_OUTPUT"
            echo "auth_sha=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate signed Codex CLI
        run: |
          CODEX_CANDIDATES=(
            "/Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"
            "/Applications/ChatGPT.app/Contents/Resources/codex"
          )
          CODEX_SOURCE=""
          for candidate in "${CODEX_CANDIDATES[@]}"; do
            if [[ -L "${candidate}" ]]; then
              echo "::error::Codex CLI candidate is a symlink; refusing to run it."
              exit 1
            fi
            if [[ -x "${candidate}" ]]; then
              CODEX_SOURCE="${candidate}"
              break
            fi
          done
          if [[ -z "${CODEX_SOURCE}" ]]; then
            echo "::error::Signed Codex CLI not found in ChatGPT.app (expected codex-cli/CodexCLI.app/Contents/MacOS/codex or Contents/Resources/codex). Install or update the OpenAI desktop app on this runner."
            exit 1
          fi
          echo "CODEX_SOURCE=${CODEX_SOURCE}" >> "$GITHUB_ENV"

      - name: Prepare and verify dedicated Anvil Codex home
        run: |
          CODEX_HOME="${HOME}/.codex-anvil"
          if [[ -L "${CODEX_HOME}" ]]; then
            echo "::error::Dedicated Anvil CODEX_HOME must not be a symlink."
            exit 1
          fi
          mkdir -p "${CODEX_HOME}"
          chmod 700 "${CODEX_HOME}"
          ANVIL_AUTH_FILE="${CODEX_HOME}/auth.json"
          if [[ ! -f "${ANVIL_AUTH_FILE}" ]]; then
            echo "::error::Dedicated Anvil auth is missing at ${ANVIL_AUTH_FILE}. Configure Anvil Codex auth on the signed-codex runner."
            exit 1
          fi
          if [[ -L "${ANVIL_AUTH_FILE}" ]]; then
            echo "::error::Dedicated Anvil auth.json must not be a symlink."
            exit 1
          fi
          if [[ ! -O "${ANVIL_AUTH_FILE}" ]]; then
            echo "::error::Dedicated Anvil auth.json must be owned by the runner user."
            exit 1
          fi
          if [[ ! -r "${ANVIL_AUTH_FILE}" || ! -w "${ANVIL_AUTH_FILE}" ]]; then
            echo "::error::Dedicated Anvil auth must be readable and writable so OAuth token rotation can persist."
            exit 1
          fi
          chmod 600 "${ANVIL_AUTH_FILE}"
          echo "CODEX_HOME=${CODEX_HOME}" >> "$GITHUB_ENV"

      - name: Run Codex security review
        id: anvil
        timeout-minutes: 15
        env:
          ANVIL_CODEX_MODEL: ${{ vars.ANVIL_CODEX_MODEL }}
          ANVIL_DEFAULT_CODEX_MODEL: "gpt-5.5"
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          trap 'rc=$?; echo "::error::review step aborted at line $LINENO (exit $rc)"' ERR

          case "${CODEX_SOURCE}" in
            */Contents/MacOS/codex) CODEX_BIN_REL="Contents/MacOS/codex" ;;
            */Contents/Resources/codex) CODEX_BIN_REL="Contents/Resources/codex" ;;
            *)
              echo "::error::Codex CLI path '${CODEX_SOURCE}' is not inside the expected signed ChatGPT.app bundle."
              exit 1
              ;;
          esac
          CODEX_SOURCE_APP="${CODEX_SOURCE%"/${CODEX_BIN_REL}"}"
          if [[ -L "${CODEX_SOURCE_APP}" ]]; then
            echo "::error::ChatGPT.app Codex bundle must not be a symlink."
            exit 1
          fi

          CODEX_DIR="$(mktemp -d "${RUNNER_TEMP}/anvil-codex.XXXXXX")"
          OUTPUT_DIR=""
          cleanup() {
            local status=$?
            trap - EXIT
            chmod -R u+w "${CODEX_DIR}" 2>/dev/null || true
            if ! rm -rf "${CODEX_DIR}" || [[ -e "${CODEX_DIR}" ]]; then
              echo "::error::Could not remove the temporary Anvil Codex copy."
              status=1
            fi
            if [[ -n "${OUTPUT_DIR}" ]] && { ! rm -rf "${OUTPUT_DIR}" || [[ -e "${OUTPUT_DIR}" ]]; }; then
              echo "::error::Could not remove temporary Anvil review output."
              status=1
            fi
            if [[ "${status}" -eq 0 ]]; then
              echo "Anvil temporary files removed."
            fi
            exit "${status}"
          }
          trap cleanup EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          OUTPUT_DIR="$(mktemp -d "${RUNNER_TEMP}/anvil-codex.output.XXXXXX")"
          OUTPUT_FILE="${OUTPUT_DIR}/review.txt"
          (umask 077; : > "${OUTPUT_FILE}")
          chmod 600 "${OUTPUT_FILE}"
          CODEX_APP="${CODEX_DIR}/$(basename "${CODEX_SOURCE_APP}")"
          cp -R "${CODEX_SOURCE_APP}" "${CODEX_APP}"
          if [[ ! -O "${CODEX_APP}" ]]; then
            echo "::error::Copied Codex app must be owned by the Anvil runner."
            exit 1
          fi
          CODEX_CONTENTS="${CODEX_APP}/Contents"
          CODEX_BIN="${CODEX_APP}/${CODEX_BIN_REL}"
          CODEX_BIN_DIR="$(dirname "${CODEX_BIN}")"
          if [[ -L "${CODEX_APP}" || -L "${CODEX_CONTENTS}" || -L "${CODEX_BIN_DIR}" || -L "${CODEX_BIN}" ]]; then
            echo "::error::Copied Codex app path contains a symlink; refusing to run it."
            exit 1
          fi
          chmod -R a-w "${CODEX_APP}"
          DEDICATED_AUTH_BEFORE="${CODEX_DIR}/dedicated-auth-before.json"
          cp "${CODEX_HOME}/auth.json" "${DEDICATED_AUTH_BEFORE}"
          chmod 400 "${DEDICATED_AUTH_BEFORE}"
          SHARED_AUTH="${HOME}/.codex/auth.json"
          SHARED_AUTH_BEFORE="${CODEX_DIR}/shared-auth-before.json"
          if [[ -f "${SHARED_AUTH}" ]]; then
            cp "${SHARED_AUTH}" "${SHARED_AUTH_BEFORE}"
            chmod 400 "${SHARED_AUTH_BEFORE}"
          fi
          chmod 500 "${CODEX_DIR}"

          OPENAI_TEAM_ID="2DC432GLL2"
          if ! codesign --verify "${CODEX_BIN}"; then
            echo "::error::Codex CLI signature verification failed."
            exit 1
          fi
          TEAM_ID="$(codesign -dv --verbose=4 "${CODEX_BIN}" 2>&1 | awk -F= '/^TeamIdentifier=/ {print $2; exit}')"
          if [[ "${TEAM_ID}" != "${OPENAI_TEAM_ID}" ]]; then
            echo "::error::Codex CLI is signed by unexpected TeamIdentifier '${TEAM_ID:-missing}'; expected OpenAI ${OPENAI_TEAM_ID}."
            exit 1
          fi
          if ! /usr/sbin/spctl -a -vv --type execute "${CODEX_APP}"; then
            echo "::error::Codex CLI failed Gatekeeper assessment."
            exit 1
          fi
          if ! SMOKE_OUTPUT="$("${CODEX_BIN}" --version 2>&1)"; then
            echo "::error::Signed Codex CLI smoke test failed: ${SMOKE_OUTPUT:-no output}."
            exit 1
          fi
          echo "codex smoke test OK: ${SMOKE_OUTPUT}"

          if ! git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"; then
            echo "::error::Could not fetch PR head; refusing to review."
            exit 1
          fi
          if [[ "$(git rev-parse FETCH_HEAD)" != "${PR_HEAD_SHA}" ]]; then
            echo "::error::PR head changed since this workflow event; refusing to review a different commit."
            exit 1
          fi
          mkdir -p .anvil
          if ! git diff "${PR_BASE_SHA}...${PR_HEAD_SHA}" > .anvil/pr-diff.patch; then
            echo "::error::Could not create the PR diff; refusing to review."
            exit 1
          fi
          DIFF_LINES="$(wc -l < .anvil/pr-diff.patch | tr -d ' ')"
          if [[ "${DIFF_LINES}" -eq 0 ]]; then
            echo "::error::PR diff is empty; refusing to report a verdict without reviewing changes."
            exit 1
          fi

          # A private repository needs checkout credentials for the fetches.
          # Remove them before Codex reads PR-controlled content.
          git config --local --unset-all http.https://github.com/.extraheader || true

          PROMPT="Security-focused adversarial review of PR #${PR_NUMBER}.

          Diff scope: changes between base ${PR_BASE_SHA} and PR head ${PR_HEAD_SHA}.
          Pre-computed diff file: .anvil/pr-diff.patch (${DIFF_LINES} lines).
          Read that file first, then read surrounding source as needed.

          Check for injection, auth/authz bypasses, insecure data handling,
          hard-coded secrets, CSRF, and logic errors in security-critical paths.
          Report every finding with file and line references. Be adversarial.

          Your entire final answer must be exactly one of these forms:
          - One or more finding lines, each: - [P0|P1|P2|P3] <title> - <file>:<line>
            (choose one priority, for example - [P1] Unsafe path check - internal/cli/wrap.go:42)
          - If there are no findings, exactly: ANVIL_NO_FINDINGS
          Do not add headers, summaries, prose, or code fences."
          MODEL_LABEL="${ANVIL_CODEX_MODEL:-${ANVIL_DEFAULT_CODEX_MODEL}}"
          CODEX_LOG="${OUTPUT_DIR}/codex-run.log"

          set +e
          python3 - \
            "${CODEX_BIN}" "${MODEL_LABEL}" "${PROMPT}" "${OUTPUT_FILE}" "${CODEX_LOG}" <<'PY'
          import os
          import signal
          import subprocess
          import sys
          import time

          codex_bin, model, prompt, output_path, log_path = sys.argv[1:]
          command = [
              codex_bin,
              "exec",
              "-c", 'sandbox_mode="read-only"',
              "-c", f"model={model}",
              "--output-last-message", output_path,
              prompt,
          ]

          def signal_group(process_group, signum):
              try:
                  os.killpg(process_group, signum)
              except ProcessLookupError:
                  pass

          def group_exists(process_group):
              try:
                  os.killpg(process_group, 0)
                  return True
              except ProcessLookupError:
                  return False
              except PermissionError:
                  return True

          with open(log_path, "wb") as log:
              process = subprocess.Popen(
                  command,
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  env={**os.environ, "NO_COLOR": "1"},
                  start_new_session=True,
              )

              def stop_process_group():
                  signal_group(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      signal_group(process.pid, signal.SIGKILL)
                      process.wait()
                  deadline = time.monotonic() + 15
                  while group_exists(process.pid) and time.monotonic() < deadline:
                      time.sleep(0.2)
                  if group_exists(process.pid):
                      signal_group(process.pid, signal.SIGKILL)
                  deadline = time.monotonic() + 5
                  while group_exists(process.pid) and time.monotonic() < deadline:
                      time.sleep(0.1)
                  if group_exists(process.pid):
                      raise RuntimeError("Codex process group cleanup could not be confirmed")

              def stop_for_signal(signum, _frame):
                  stop_process_group()
                  raise SystemExit(128 + signum)

              signal.signal(signal.SIGTERM, stop_for_signal)
              signal.signal(signal.SIGINT, stop_for_signal)
              try:
                  exit_code = process.wait(timeout=10 * 60)
              except subprocess.TimeoutExpired:
                  stop_process_group()
                  exit_code = 124
              else:
                  # Codex may leave helper children behind after its main process exits.
                  stop_process_group()

          raise SystemExit(exit_code)
          PY
          CODEX_EXIT=$?
          set -e
          echo "codex_exit=${CODEX_EXIT}" >> "$GITHUB_OUTPUT"

          python3 - \
            "${CODEX_DIR}/dedicated-auth-before.json" \
            "${CODEX_HOME}/auth.json" \
            "${CODEX_DIR}/shared-auth-before.json" \
            "${HOME}/.codex/auth.json" \
            "${OUTPUT_FILE}" <<'PY'
          import json
          import sys

          auth_paths, output_path = sys.argv[1:-1], sys.argv[-1]
          try:
              with open(output_path, "r", errors="replace") as stream:
                  output = stream.read()
          except OSError:
              sys.exit(0)
          secrets = set()

          def collect(node):
              if isinstance(node, dict):
                  for value in node.values():
                      collect(value)
              elif isinstance(node, list):
                  for value in node:
                      collect(value)
              elif isinstance(node, str) and len(node) >= 8:
                  secrets.add(node)

          for auth_path in auth_paths:
              try:
                  with open(auth_path) as stream:
                      collect(json.load(stream))
              except (OSError, ValueError):
                  pass
          for secret in sorted(secrets, key=len, reverse=True):
              output = output.replace(secret, "[REDACTED-CODEX-AUTH]")
          with open(output_path, "w") as stream:
              stream.write(output)
          PY
          REVIEW_PATH="$(python3 scripts/anvil-output.py store \
            "${OUTPUT_FILE}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${PR_HEAD_SHA}")"
          echo "Redacted Anvil review stored at ${REVIEW_PATH}"
          echo "review_path=${REVIEW_PATH}" >> "$GITHUB_OUTPUT"
          REVIEW_VERDICT="$(python3 scripts/anvil-output.py verdict "${OUTPUT_FILE}")"
          echo "review_verdict=${REVIEW_VERDICT}" >> "$GITHUB_OUTPUT"
          if [[ "${CODEX_EXIT}" != "0" ]]; then
            echo "::warning::Codex exited with ${CODEX_EXIT}; review cannot pass."
          elif [[ "${REVIEW_VERDICT}" == "findings" ]]; then
            echo "::warning::Anvil review reported one or more finding lines."
          elif [[ "${REVIEW_VERDICT}" == "unparseable" ]]; then
            echo "::error::unparseable review output"
          fi

      - name: Post Anvil review comment
        if: always() && steps.anvil.outputs.review_path != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          ANVIL_EXIT: ${{ steps.anvil.outputs.codex_exit }}
          ANVIL_VERDICT: ${{ steps.anvil.outputs.review_verdict }}
          ANVIL_REVIEW_PATH: ${{ steps.anvil.outputs.review_path }}
        with:
          script: |
            const exitCode = process.env.ANVIL_EXIT || '0';
            const verdict = process.env.ANVIL_VERDICT || 'unparseable';
            const reviewPath = process.env.ANVIL_REVIEW_PATH || '';
            const passed = exitCode === '0' && verdict === 'clean';
            const header = passed
              ? '## 🔨 Anvil Security Review'
              : '## 🔨 Anvil Security Review — FAILED';
            const result = exitCode !== '0'
              ? `Review process exited ${exitCode}; the review failed closed.`
              : verdict === 'findings'
                ? 'Anvil reported one or more finding lines; the review failed closed.'
                : verdict === 'unparseable'
                  ? 'unparseable review output; the review failed closed.'
                  : 'Anvil returned ANVIL_NO_FINDINGS.';
            const body = [
              header,
              '',
              result,
              '',
              `Redacted review output is stored on the runner at: \`${reviewPath}\``,
              '',
              '*Review text is not included in this comment. This review does not replace human review.*',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const previous = comments.reverse().find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith('## 🔨 Anvil Security Review'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Verify shared Codex auth untouched
        if: always() && steps.shared-codex-auth.outcome == 'success'
        env:
          AUTH_PRESENT_BEFORE: ${{ steps.shared-codex-auth.outputs.auth_present }}
          AUTH_SHA_BEFORE: ${{ steps.shared-codex-auth.outputs.auth_sha }}
        run: |
          AUTH_FILE="${HOME}/.codex/auth.json"
          if [[ "${AUTH_PRESENT_BEFORE}" == "true" ]]; then
            if [[ ! -f "${AUTH_FILE}" ]]; then
              echo "::error::Shared Codex auth file disappeared during Anvil."
              exit 1
            fi
            AUTH_SHA_AFTER="$(shasum -a 256 "${AUTH_FILE}" | awk '{print $1}')"
          else
            if [[ -f "${AUTH_FILE}" ]]; then
              echo "::error::Shared Codex auth file was created during Anvil."
              exit 1
            fi
            AUTH_SHA_AFTER="missing"
          fi
          if [[ "${AUTH_SHA_AFTER}" != "${AUTH_SHA_BEFORE}" ]]; then
            echo "::error::Shared Codex auth file changed during Anvil."
            exit 1
          fi
          echo "Shared Codex auth unchanged."

      - name: Fail job unless Anvil returned the clean sentinel
        if: always()
        env:
          CODEX_EXIT: ${{ steps.anvil.outputs.codex_exit }}
          ANVIL_VERDICT: ${{ steps.anvil.outputs.review_verdict }}
          ANVIL_REVIEW_PATH: ${{ steps.anvil.outputs.review_path }}
          ANVIL_STEP_OUTCOME: ${{ steps.anvil.outcome }}
        run: |
          if [[ "${ANVIL_STEP_OUTCOME:-}" != "success" || "${CODEX_EXIT:-}" != "0" || "${ANVIL_VERDICT:-}" != "clean" || -z "${ANVIL_REVIEW_PATH:-}" ]]; then
            echo "::error::Anvil failed closed: step=${ANVIL_STEP_OUTCOME:-not-run}, Codex exit=${CODEX_EXIT:-not-run}, verdict=${ANVIL_VERDICT:-unparseable}, review path=${ANVIL_REVIEW_PATH:-missing}."
            exit 1
          fi
          echo "Anvil passed: Codex exited successfully, returned ANVIL_NO_FINDINGS, and stored the redacted review."
