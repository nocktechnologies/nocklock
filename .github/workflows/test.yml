name: test

on:
  push:
    branches: [main, next]
  pull_request:
    # ready_for_review is included so the macos-enforce job's
    # `draft == false` gate fires on the draft→ready transition. This applies
    # to the whole trigger, so the ubuntu test and
    # fuzz-smoke jobs also re-run when a draft PR is marked ready — a cheap,
    # desirable full-CI pass at the moment a PR opens for review.
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual reruns against any ref (e.g. to soak the fuzz-smoke budget).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Docs-only pull requests skip the suites (scripts/ci-code-changed.sh).
  changes:
    name: change detect (docs-only PRs skip the suites)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: changes
        run: bash scripts/ci-code-changed.sh

  test:
    name: build · vet · fmt · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      # Required check: it always reports. On a docs-only PR the steps below skip
      # and the job still goes green (scripts/ci-code-changed.sh).
      - name: change detect (docs-only PRs skip the suite)
        id: changes
        run: bash scripts/ci-code-changed.sh

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        if: steps.changes.outputs.code == 'true'
        run: go build ./...

      # Cheap cross-check that the CLI still compiles for darwin. The macOS
      # enforcement job is PR-and-non-draft-only, so it does not guard pushes to
      # main or next; this step runs on every push and PR and catches a non-Linux
      # build break (the exact gap that let wrap.go:413 ship — N10709).
      # `go vet` (not `go build`) because it compiles the non-test code AND
      # type-checks _test.go files, so a darwin-only test-file break is caught
      # here too rather than only in the PR-gated macOS job.
      - name: cross-vet (darwin)
        if: steps.changes.outputs.code == 'true'
        run: GOOS=darwin GOARCH=arm64 go vet ./...

      - name: vet
        if: steps.changes.outputs.code == 'true'
        run: go vet ./...

      - name: gofmt
        if: steps.changes.outputs.code == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Runs on docs-only PRs too: these gates police the docs themselves.
      - name: public content check
        run: |
          git fetch origin next --depth=1
          python3 scripts/check-public-content.py
          python3 scripts/check-agents-paths.py

      - name: script tests
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 -m unittest discover -s scripts -p test_public_checks.py -v
          python3 -m unittest discover -s scripts -p test_ci_code_changed.py -v
          python3 -m unittest discover -s scripts -p test_credential_cleanup.py -v

      - name: test
        if: steps.changes.outputs.code == 'true'
        run: go test ./... -count=1

      # The suite above proves `verify --export ocsf` reproduces this golden
      # export byte for byte; this step validates the golden against the pinned
      # OCSF class schemas. The schema server renders slowly, so the schemas are
      # cached; the script checks their SHA-256 digests on every run.
      - name: cache OCSF schemas
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/nocklock-ocsf-schema
          key: ocsf-schema-${{ hashFiles('scripts/check-ocsf-schema.py') }}

      - name: OCSF export schema check
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 20
        run: |
          python3 -m venv "$RUNNER_TEMP/ocsf-venv"
          "$RUNNER_TEMP/ocsf-venv/bin/pip" install --quiet 'jsonschema==4.23.0'
          "$RUNNER_TEMP/ocsf-venv/bin/python" scripts/check-ocsf-schema.py \
            --schema-dir "$HOME/.cache/nocklock-ocsf-schema" \
            internal/cli/testdata/ocsf/export.golden.jsonl

      - name: Landlock probe thread-affinity regression
        if: steps.changes.outputs.code == 'true'
        run: |
          for procs in 2 8 32; do
            GOMAXPROCS="$procs" go test ./internal/fence/fs/landlock \
              -run '^TestLandlock(AllowRWPaths|ChildCanMutateRootButNotRelocatedAudit|SocketOnlyPreservesCrossDirectoryOperations)$' \
              -count=10 -v -timeout=3m
          done

      - name: deterministic cross-thread Landlock control
        if: steps.changes.outputs.code == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_landlock_probe_thread_affinity.py
          python3 scripts/test-landlock-probe-thread-affinity.py

      - name: concurrent proxy stop race regression
        if: steps.changes.outputs.code == 'true'
        run: go test -race -run '^TestProxyStopConcurrent$' -count=20 ./internal/fence/network

      - name: netns proxy shutdown race regression
        if: steps.changes.outputs.code == 'true'
        run: go test -race -count=20 ./internal/fence/network/netns/...

      - name: fresh Linux init and wrapped shell
        if: steps.changes.outputs.code == 'true'
        run: |
          make build-all
          bash scripts/test-init-default-linux.sh


      - name: credential deny canaries and policy-removal mutation (CI only)
        timeout-minutes: 5
        if: steps.changes.outputs.code == 'true'
        run: |
          make build-fence-fs
          proof_bin="$HOME/.cache/nocklock-credential-proof"
          mkdir -p "$proof_bin"
          go build -o "$proof_bin/nocklock" ./cmd/nocklock
          install -m 0755 internal/fence/fs/interposer/libfence_fs.so "$proof_bin/libfence_fs.so"
          python3 scripts/build-credential-deny-mutant.py "$proof_bin/nocklock-mutant"
          python3 scripts/test-credential-denies.py --binary "$proof_bin/nocklock" --mutant "$proof_bin/nocklock-mutant"

  unpinned-landlock-soak:
    name: optional unpinned Landlock reproduction
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: attempt natural migration (inconclusive is not an enforcement pass)
        run: python3 scripts/test-landlock-probe-thread-affinity.py --unpinned

  claude-code-preset:
    name: claude-code preset · Landlock enforcement (non-root)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The preset grants ~/.cache read-only, while the checkout itself is not
      # readable from inside the fence. Keep the executable and its trusted
      # LD_PRELOAD sidecar together in a preset-readable directory.
      - name: build and stage nocklock with the filesystem interposer
        run: |
          make build build-fence-fs
          install -d "$HOME/.claude"
          install -d "$HOME/.cache/nocklock-ci"
          install -m 0755 nocklock "$HOME/.cache/nocklock-ci/nocklock"
          install -m 0755 internal/fence/fs/interposer/libfence_fs.so \
            "$HOME/.cache/nocklock-ci/libfence_fs.so"

      # GitHub's runner user is unprivileged. Strict mode converts every missing
      # prerequisite into a failure, so these enforcement proofs cannot go green
      # by silently skipping.
      - name: run claude-code preset enforcement proofs (skips forbidden)
        run: |
          NOCKLOCK_AUDIT_REQUIRE=1 \
            NOCKLOCK_TEST_BIN="$HOME/.cache/nocklock-ci/nocklock" \
            go test ./internal/cli/ -run '^TestWrapClaudeCodePreset' -v -count=1

  fuzz-smoke:
    name: fuzz smoke (fence decision surface)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Wall-clock ceiling for the exec-count budgets below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Bounded continuous fuzzing of the security-critical decision surface.
      # -fuzz runs one target per package, so each is invoked separately with a
      # short budget; the seed corpus also runs as regression cases in the `test`
      # job above (go test without -fuzz). Raise -fuzztime for deeper hunts.
      #
      # The budget is an exec count (-fuzztime=Nx), not wall time: a wall-time
      # -fuzztime can end in a spurious "context deadline exceeded" FAIL with no
      # crasher (Go's coordinator leaks its own timeout error when the deadline
      # lands mid-exchange), and -timeout does not apply under -fuzz. A slow
      # runner now takes longer instead of failing. Each N sits just below the
      # fewest execs that target reached in 25s on ubuntu-latest (N10854).
      - name: fuzz config load (fail-closed parse)
        run: go test ./internal/config/ -run='^$' -fuzz=FuzzConfigLoad -fuzztime=15000x

      - name: fuzz fs fence path decision (symlink / fail-open)
        run: go test ./internal/fence/fs/ -run='^$' -fuzz=FuzzFsFencePathDecision -fuzztime=10000x

      - name: fuzz landlock ruleset containment (grant/deny)
        run: go test ./internal/fence/fs/landlock/ -run='^$' -fuzz=FuzzRulesFromConfigContainment -fuzztime=100000x

  macos-enforce:
    name: macOS SBPL fence enforcement proof (sandbox-exec)
    # The SBPL fence's runtime ENFORCEMENT can only be exercised on real macOS
    # via sandbox-exec, so this is the ONLY job where the deny→blocked /
    # allow→success proof actually runs. Runs beside (never before) the ubuntu
    # `test` job — no `needs: test`, so it can neither delay nor skip it.
    #
    # Runs on a GitHub-hosted macos-latest runner (ephemeral + isolated), so PR
    # test code — even from forks — executes on an ephemeral runner.
    # sandbox-exec ships on the hosted image.
    needs: changes
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Prove the CLI actually builds and vets on native darwin. The ubuntu
      # job's cross-vet catches most breaks, but only a real darwin toolchain
      # exercises the darwin-tagged code paths and macOS-specific path/timezone
      # behaviour. build+vet come first because nothing else can run until the
      # tree compiles.
      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # The enforcement tests are darwin build-tagged, so they compile and run
      # natively on this macOS runner (no cross-build flag needed). Running the
      # whole fs package auto-picks up any future sibling darwin-tagged proof.
      #
      # NOCKLOCK_SANDBOX_REQUIRE=1 turns the tests' normally-green "sandbox-exec
      # unavailable" skip into a HARD FAILURE (via the requireSandboxExec gate),
      # so a runner that has lost sandbox-exec can never report green by silently
      # skipping the only proof of the SBPL fence's runtime enforcement — exactly
      # the "enforcement has NEVER run in CI" gap (N9222) this job closes.
      # Mirrors network-egress.yml's NOCKLOCK_NETNS_REQUIRE gate.
      - name: run SBPL enforcement proof (deny→blocked / allow→success)
        env:
          NOCKLOCK_SANDBOX_REQUIRE: "1"
        run: go test ./internal/fence/fs/ -count=1 -v

      - name: credential deny canaries and policy-removal mutation (CI only)
        timeout-minutes: 5
        run: |
          proof_bin="$HOME/.cache/nocklock-credential-proof"
          mkdir -p "$proof_bin"
          go build -o "$proof_bin/nocklock" ./cmd/nocklock
          python3 scripts/build-credential-deny-mutant.py "$proof_bin/nocklock-mutant"
          python3 scripts/test-credential-denies.py --binary "$proof_bin/nocklock" --mutant "$proof_bin/nocklock-mutant"

      # A fresh `nocklock init` config must pass its own `doctor` and wrap
      # under the syscall rule both apply on macOS (N11047).
      #
      # Hosted macOS runners let sudo run without a password prompt, and
      # Seatbelt does not stop sudo, so doctor lists a reachable sudo-no-prompt
      # deputy and reads PARTIAL (exit 3). Exit 3 passes only when deputies are
      # the sole reason: no gaps, every boundary enforced, every warning in the
      # Deputies group, and the sudo row present. That makes this step a live
      # proof of the deputy scan. Exit 0 still requires PROTECTED with nothing
      # reachable; any other exit fails.
      - name: init, doctor, wrap on the default config
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/nocklock-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/nocklock-config
        run: |
          go build -o "$RUNNER_TEMP/nocklock" ./cmd/nocklock
          proj="$(mktemp -d)"
          cd "$proj"
          "$RUNNER_TEMP/nocklock" init
          rc=0
          "$RUNNER_TEMP/nocklock" doctor --json > "$RUNNER_TEMP/doctor.json" || rc=$?
          cat "$RUNNER_TEMP/doctor.json"
          case "$rc" in
            0)
              jq -e '.verdict == "PROTECTED"
                and ([.checks[] | select(.group == "Deputies" and .status == "reachable")] | length == 0)' \
                "$RUNNER_TEMP/doctor.json"
              ;;
            3)
              jq -e '.verdict == "PARTIAL"
                and ((.gaps // []) | length == 0)
                and (.boundaries | length > 0)
                and all(.boundaries[]; .posture == "enforced")
                and all(.checks[] | select(.severity == "warning" or .severity == "critical"); .group == "Deputies")
                and any(.checks[]; .group == "Deputies" and .name == "sudo-no-prompt" and .status == "reachable")' \
                "$RUNNER_TEMP/doctor.json"
              ;;
            *)
              echo "doctor exited $rc; want 0 (PROTECTED) or 3 (PARTIAL from deputies only)" >&2
              exit 1
              ;;
          esac
          "$RUNNER_TEMP/nocklock" wrap -- /bin/echo WRAP_OK

      # The full non-root unit suite, natively on darwin. The seven Linux
      # path/Seatbelt assumptions that used to be skipped by name were fixed in
      # N10714 (validatePath resolves the deepest existing ancestor;
      # RulesFromConfig-comparison tests normalise the temp root; the macOS
      # Seatbelt filesystem.root refusal and verify's platform gating are now
      # asserted per-platform), so the whole suite runs. A darwin regression
      # that compiles and vets but fails at runtime turns this job red.
      # Runs last so it cannot preempt the SBPL enforcement proof above.
      - name: test (non-root unit suite)
        run: go test ./... -count=1
