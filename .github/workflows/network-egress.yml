name: network-egress

# CI for the Linux network-egress-enforcement track (Candidate B: netns +
# transparent redirect). See
# docs/superpowers/specs/2026-07-30-linux-network-egress-enforcement.md.
#
# Two jobs, each closing a named open item in that spec's Phase 0:
#   - egress-probe   → Q1 "CI-runner kernel coverage": run the merged, repeatable
#     `nocklock egress-probe` (#70) on ubuntu-latest so the CI kernel is measured
#     identically to the dev VPS. Non-mutating and always exits 0 on completion;
#     it produces a RECEIPT, it does not gate. Runs twice — bare runner image and
#     nftables-provisioned — so the artifact distinguishes "this kernel can't"
#     from "this image doesn't ship nftables" (a bare-image run reports
#     track=blocked purely because `nft` is absent, which would misrepresent the
#     finding if reported alone).
#   - q6-acceptance  → the Q6 post-drop mutation acceptance test (#74) actually
#     EXECUTED. That test self-skips when not root, so until now it has never run
#     anywhere — a skip is not a pass. This job runs it as root with
#     NOCKLOCK_Q6_REQUIRE=1 so a misconfigured runner FAILS instead of
#     green-skipping. It is the receipted bypass-resistance bar between Phase 0
#     and Phase 1.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  egress-probe:
    name: egress-probe · Q1 CI-runner coverage (receipt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build nocklock
        run: go build -o nocklock ./cmd/nocklock

      # Bare runner image: nftables is NOT preinstalled on ubuntu-latest, so this
      # run is expected to report track=blocked on missing `nft`. Captured so the
      # "image doesn't ship it" case is explicit, never conflated with a kernel
      # that cannot host the fence.
      - name: probe — bare runner image
        run: |
          ./nocklock egress-probe | tee egress-probe-bare.txt
          ./nocklock egress-probe --json > egress-probe-bare.json

      - name: provision nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2

      # Provisioned: nft present, so the verdict now reflects what the KERNEL can
      # do (userns/netns gating, tproxy availability, privileged-helper path).
      - name: probe — nftables-provisioned
        run: |
          ./nocklock egress-probe | tee egress-probe-provisioned.txt
          ./nocklock egress-probe --json > egress-probe-provisioned.json

      - name: summarize track verdicts
        run: |
          {
            echo "### egress-probe — Q1 CI-runner coverage"
            echo ""
            echo "| image | track | nft | userns | userns+netns (mapped) | userns+netns (unmapped) | cause evidence | cause detail |"
            echo "|---|---|---|---|---|---|---|---|"
            for f in bare provisioned; do
              json="egress-probe-$f.json"
              track=$(jq -r '.track' "$json")
              nft=$(jq -r '(.checks[] | select(.id=="nftables-binary") | .status) // "n/a"' "$json")
              userns=$(jq -r '(.checks[] | select(.id=="unprivileged-userns") | .status) // "n/a"' "$json")
              mapped=$(jq -r '(.checks[] | select(.id=="unprivileged-userns-netns") | .status) // "n/a"' "$json")
              unmapped=$(jq -r '(.checks[] | select(.id=="unprivileged-userns-netns-unmapped") | .status) // "n/a"' "$json")
              causeEvidence=$(jq -r '(.checks[] | select(.id=="unprivileged-userns-cause") | .status) // "n/a"' "$json")
              causeDetail=$(jq -r '(.checks[] | select(.id=="unprivileged-userns-cause") | .detail) // "n/a"' "$json")
              # The cause detail is free-text prose from the probe; escape any literal
              # '|' so a pipe in the string can't break the markdown table row.
              causeDetail=${causeDetail//|/\\|}
              echo "| $f | \`$track\` | $nft | $userns | $mapped | $unmapped | $causeEvidence | $causeDetail |"
            done
            echo ""
            echo "Full JSON receipts are attached as the \`egress-probe-results\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: egress-probe-results
          path: egress-probe-*.json
          if-no-files-found: error

  q6-acceptance:
    name: Q6 netns bypass-resistance · post-drop mutation (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: provision iproute2 + nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables

      # Compile the acceptance test AS THE RUNNER USER so root never writes into
      # the Go build/module cache (which setup-go persists — root-owned files
      # there break the cache save). The compiled binary re-execs itself as the
      # Q6 child helper, so a standalone binary is exactly what the test needs.
      - name: compile Q6 acceptance test
        run: go test -c -o netns.test ./internal/fence/network/netns/

      # Run as root with NOCKLOCK_Q6_REQUIRE=1 so a non-root or tool-missing
      # runner HARD-FAILS instead of silently skipping. secure_path reaches
      # ip/nft in /usr/sbin. This is the first time this bar actually executes.
      - name: run Q6 acceptance test as root (skips forbidden)
        run: sudo env NOCKLOCK_Q6_REQUIRE=1 ./netns.test -test.run '^TestQ6' -test.v -test.count=1

  netns-foundation:
    name: netns Phase-1 foundation · default-drop denies all egress (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: provision iproute2 + nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables

      # Compile AS THE RUNNER USER so root never writes into the Go build/module
      # cache (setup-go persists it; root-owned files there break the cache save).
      # The compiled binary re-execs itself as the capped egress child, so a
      # standalone binary is exactly what the test needs — same idiom as Q6.
      - name: compile netns foundation acceptance test
        run: go test -c -o netns.test ./internal/fence/network/netns/

      # Run as root with NOCKLOCK_NETNS_REQUIRE=1 so a non-root or tool-missing
      # runner HARD-FAILS instead of silently skipping (mirrors the Q6 gate). This
      # is the receipted Phase-1 foundation bar: with the default-drop base
      # installed, the capped child is denied ALL egress (external TCP + UDP/53).
      # An exact ^TestNetnsFoundation anchor + -test.v means a pattern that matched
      # nothing would be visible, not a silent green.
      - name: run netns foundation acceptance test as root (skips forbidden)
        run: sudo env NOCKLOCK_NETNS_REQUIRE=1 ./netns.test -test.run '^TestNetnsFoundation' -test.v -test.count=1

  netns-protocol-matrix:
    name: netns Phase-1b protocol matrix · tproxy allowlist and DNS stub (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: provision network and fallback clients
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables curl nodejs python3-requests
          curl -sSfL https://github.com/stunnel/static-curl/releases/download/8.22.0/curl-linux-x86_64-glibc-8.22.0.tar.xz -o /tmp/curl-http3.tar.xz
          echo 'd74460e43c0e6eaf40ec1fdda92c53dee94da8a6e6db066711541ada5aab0fa6  /tmp/curl-http3.tar.xz' | sha256sum -c -
          tar -C /tmp -xf /tmp/curl-http3.tar.xz curl
          sudo install -m 0755 /tmp/curl /usr/local/bin/curl
          /usr/local/bin/curl --version

      - name: compile Phase-1b protocol matrix
        run: go test -c -o netns.test ./internal/fence/network/netns/

      # This is deliberately an exact test anchor. Every protocol row asserts
      # its own outcome: positive HTTP(S), proxy 403/close, fixed DNS answers,
      # direct-resolver no-answer, UDP/SCTP denial, TCP fallback clients, and
      # proxy-death watchdog child termination.
      - name: run Phase-1b protocol matrix as root (skips forbidden)
        run: sudo env "PATH=/usr/local/bin:$PATH" NOCKLOCK_PROTOCOL_REQUIRE=1 ./netns.test -test.run '^TestNetnsProtocolMatrix$' -test.v -test.count=1

  netns-egress-audit:
    name: netns egress decision audit · signed rows via `nocklock wrap` (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: provision iproute2 + nftables + curl + gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables curl build-essential

      # Build the binary the acceptance test drives, and install the privileged
      # helper the way the spec's HOST INSTALLER would: a fixed, root-owned entry
      # at /usr/libexec/nocklock-egress-helper that maps the two sudoers vectors
      # (`check`, `setup`) — plus the internal `__netns-*` sidecar re-execs — onto
      # the nocklock binary. `exec` preserves the SUDO_UID/SUDO_GID the child
      # credential check requires, and leaves os.Executable() pointing at the real
      # binary so sidecar re-execs resolve correctly. On GitHub-hosted runners the
      # default NOPASSWD-ALL sudoers already satisfies `sudo -n <helper> check`.
      - name: build nocklock and install the privileged egress helper
        run: |
          go build -o nocklock ./cmd/nocklock
          sudo install -m 0755 nocklock /usr/local/bin/nocklock
          sudo mkdir -p /usr/libexec
          sudo tee /usr/libexec/nocklock-egress-helper >/dev/null <<'EOF'
          #!/bin/sh
          exec /usr/local/bin/nocklock __netns-helper "$@"
          EOF
          sudo chmod 0755 /usr/libexec/nocklock-egress-helper
          sudo -n /usr/libexec/nocklock-egress-helper check && echo "helper preflight OK"

      # This job keeps the filesystem fence ON (the test sets [filesystem].root),
      # so wrap needs the trusted LD_PRELOAD interposer — without it wrap refuses
      # to launch ("trusted filesystem fence library not found"). The other root
      # jobs never hit this because they drive the sidecars directly, not `wrap`.
      # Build it with the repo's own target and install to a TRUSTED search path
      # (findTrustedLibFenceFS accepts /usr/local/lib/nocklock/libfence_fs.so).
      - name: build and install the filesystem-fence interposer (libfence_fs.so)
        run: |
          make build-fence-fs
          sudo mkdir -p /usr/local/lib/nocklock
          sudo install -m 0755 internal/fence/fs/interposer/libfence_fs.so \
            /usr/local/lib/nocklock/libfence_fs.so
          ls -l /usr/local/lib/nocklock/libfence_fs.so

      # Run the acceptance test AS THE RUNNER USER (NOT under sudo): wrap sudo's
      # the helper itself, and the fenced child drops to the invoking (runner)
      # uid — a root invoker would be rejected as the child credential. This is
      # the OPPOSITE of the matrix/foundation jobs, which invoke a compiled test
      # binary under sudo. NOCKLOCK_AUDIT_REQUIRE=1 turns a would-be skip
      # (helper/sudo unreachable) into a hard failure so a misconfigured runner is
      # loud, not green. NOCKLOCK_TEST_BIN points the test at the installed binary.
      - name: run egress decision audit acceptance test (runner user, skips forbidden)
        run: |
          NOCKLOCK_AUDIT_REQUIRE=1 NOCKLOCK_TEST_BIN=/usr/local/bin/nocklock \
            go test ./internal/cli/ -run '^TestWrapNetnsEgressDecisionAudit$' -v -count=1

  egress-helper-install-readme:
    name: egress helper install · shipped installer (README path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The privileged `check` verb resolves `ip` and `nft`, so provision them —
      # same as the sibling root jobs — or the preflight fails for reasons
      # unrelated to the installer.
      - name: provision iproute2 + nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables

      # Build AS THE RUNNER USER, then install the binary with sudo. We do NOT
      # run `sudo make install` because sudo's secure_path drops setup-go's Go
      # toolchain from PATH (and would build as root into the persisted cache);
      # this mirrors the sibling netns-egress-audit job.
      - name: build nocklock and install the binary
        run: |
          go build -o nocklock ./cmd/nocklock
          sudo install -m 0755 nocklock /usr/local/bin/nocklock

      # Install the helper by running THE SHIPPED SCRIPT — the README path — so CI
      # exercises the real installer (root-owned shim + visudo-validated sudoers
      # drop-in), not an inline tee. The scoped sudoers.d grant is additive to the
      # hosted runner's NOPASSWD-ALL.
      - name: install the egress helper via the shipped script
        run: sudo scripts/install-egress-helper.sh

      - name: assert the helper preflight succeeds
        run: |
          out=$(sudo -n /usr/libexec/nocklock-egress-helper check 2>&1) && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "helper preflight FAILED (rc=$rc): $out"
            exit 1
          fi
          echo "helper preflight OK"

      # Receipts that the scoped drop-in actually parsed (independent of the
      # runner's blanket NOPASSWD): visudo -c parses the whole /etc/sudoers.d,
      # and `sudo -l` must show the scoped helper commands.
      - name: show the installed sudoers grant is parsed
        run: |
          # The drop-in is 0440 in the root-only 0750 /etc/sudoers.d, so read it
          # with sudo; the grant is written for the runner user, so `sudo -l`
          # (as that user) is where it shows up.
          sudo ls -l /etc/sudoers.d/nocklock-egress
          sudo visudo -c
          sudo -n -l | grep -F nocklock-egress-helper

      # `nocklock doctor` early-returns a critical "config missing" before any
      # fence check runs, so init a config first. Run doctor as the runner user
      # (not sudo) and don't let a possible exit-1 sink the step; then assert the
      # egress-helper check is severity ok.
      - name: assert nocklock doctor reports egress-helper ok
        run: |
          work=$(mktemp -d)
          cd "$work"
          nocklock init
          nocklock doctor --json > doctor.json || true
          cat doctor.json
          jq -e '.checks[] | select(.name=="egress-helper") | .severity == "ok"' doctor.json
