name: Linux release assets

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      receipt_dry_run:
        description: Exercise receipt packaging on this branch without a release tag
        type: boolean
        default: false

# Produces signed assets and acceptance evidence. Publication remains an explicit
# release-owner action after the existing release gates; no contents:write here.
permissions:
  contents: read

jobs:
  kernel_receipt:
    if: startsWith(github.ref, 'refs/tags/') || inputs.receipt_dry_run == true
    uses: ./.github/workflows/landlock-abi9-receipt.yml
    with:
      release_invocation: true
    permissions:
      contents: read
      id-token: write

  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build paired tagged release and standalone installer
        id: build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash packaging/linux/build-candidate.sh "$RUNNER_TEMP/release" "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Sign both manifests with exact release workflow identity
        env:
          RELEASE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          bash packaging/linux/sign-manifest.sh "$RUNNER_TEMP/release" "$RELEASE_IDENTITY"
          bash packaging/linux/sign-manifest.sh "$RUNNER_TEMP/release" "$RELEASE_IDENTITY" INSTALLER.SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64-release-assets
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  accept:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-amd64-release-assets
          path: ${{ runner.temp }}/release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Prepare disposable host
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables sudo python3
          for directory in / /usr /usr/local /usr/local/bin /usr/local/lib /opt; do
            test ! -L "$directory"
            test -d "$directory"
          done
          for directory in /usr/local /usr/local/bin /usr/local/lib /opt; do
            sudo chown root:root "$directory"
            sudo chmod go-w "$directory"
          done
      - name: Authenticate bootstrap and exercise production installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sudo env -i GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            /usr/bin/python3 packaging/linux/provision-release-ci.py \
            "$RUNNER_TEMP/release" "$(command -v cosign)" "$RELEASE_TAG"
          sudo install -m 0755 packaging/linux/accept-installed.sh /usr/local/bin/nocklock-accept-ci
          sudo install -m 0644 packaging/linux/acceptance.py /usr/local/bin/nocklock-check-acceptance-ci.py
      - name: Unprivileged CONFINED and KERNEL acceptance
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sudo -u nocklock-candidate env -i HOME=/home/nocklock-candidate \
            USER=nocklock-candidate LOGNAME=nocklock-candidate PATH=/usr/bin:/bin \
            /bin/bash /usr/local/bin/nocklock-accept-ci \
            "$RELEASE_COMMIT" /home/nocklock-candidate/evidence "$RELEASE_TAG"
      - name: Collect public evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if sudo test -d /home/nocklock-candidate/evidence; then
            sudo cp -r /home/nocklock-candidate/evidence/. "$RUNNER_TEMP/evidence/"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/evidence"
          fi
      - name: Record passed Linux acceptance
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          for mode in ('proxy', 'netns'):
              row = json.loads((root / mode / 'receipt.json').read_text())
              assert row['kind'] == 'release-install-acceptance'
              assert row['commit'] == os.environ['RELEASE_COMMIT']
              assert row['audit'] == 'AUTHENTIC'
              assert row['egress_level'] == {'proxy': 'CONFINED', 'netns': 'KERNEL'}[mode]
              assert row['filesystem_allow'] and row['filesystem_deny_errno']
          (root / 'linux-release-acceptance.json').write_text(json.dumps({
              'kind': 'release-install-acceptance', 'commit': os.environ['RELEASE_COMMIT'],
              'tag': os.environ['RELEASE_TAG'], 'modes': ['proxy', 'netns'],
          }, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-amd64-release-acceptance
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [build, accept, kernel_receipt]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-amd64-release-assets
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-amd64-release-acceptance
          path: ${{ runner.temp }}/acceptance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landlock-abi9-receipt
          path: ${{ runner.temp }}/receipt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Authenticate ABI 9 receipt and assemble publishable assets
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RECEIPT_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          test "$RELEASE_COMMIT" = "$GITHUB_SHA"
          cosign verify-blob "$RUNNER_TEMP/receipt/landlock-abi9-receipt.json" \
            --bundle "$RUNNER_TEMP/receipt/landlock-abi9-receipt.json.sigstore.json" \
            --certificate-identity "$RECEIPT_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python3 packaging/linux/assemble-release-evidence.py \
            --receipt "$RUNNER_TEMP/receipt" --acceptance "$RUNNER_TEMP/acceptance" \
            --assets "$RUNNER_TEMP/linux" --output "$RUNNER_TEMP/publish" \
            --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          bash packaging/linux/sign-manifest.sh "$RUNNER_TEMP/publish" "$RECEIPT_IDENTITY"
          (cd "$RUNNER_TEMP/publish" && sha256sum --check --strict SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release-publishable-assets
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error
          retention-days: 30

  receipt_dry_run:
    needs: kernel_receipt
    if: github.event_name == 'workflow_dispatch' && inputs.receipt_dry_run == true && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landlock-abi9-receipt
          path: ${{ runner.temp }}/receipt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Exercise release evidence assembly without a tag
        env:
          RECEIPT_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify-blob "$RUNNER_TEMP/receipt/landlock-abi9-receipt.json" \
            --bundle "$RUNNER_TEMP/receipt/landlock-abi9-receipt.json.sigstore.json" \
            --certificate-identity "$RECEIPT_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          mkdir "$RUNNER_TEMP/acceptance"
          jq -n --arg commit "$GITHUB_SHA" \
            '{kind:"branch-dry-run-placeholder",commit:$commit}' \
            > "$RUNNER_TEMP/acceptance/linux-release-acceptance.json"
          python3 packaging/linux/assemble-release-evidence.py \
            --receipt "$RUNNER_TEMP/receipt" --acceptance "$RUNNER_TEMP/acceptance" \
            --output "$RUNNER_TEMP/dry-run" --commit "$GITHUB_SHA" --dry-run
          bash packaging/linux/sign-manifest.sh "$RUNNER_TEMP/dry-run" "$RECEIPT_IDENTITY"
          (cd "$RUNNER_TEMP/dry-run" && sha256sum --check --strict SHA256SUMS)
          cat "$RUNNER_TEMP/dry-run/SHA256SUMS"
          cat "$RUNNER_TEMP/dry-run/release-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-receipt-dry-run-NOT-FOR-PUBLICATION
          path: ${{ runner.temp }}/dry-run/
          if-no-files-found: error
