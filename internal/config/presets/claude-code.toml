[project]
name = "claude-code"
root = "."

[filesystem]
root = "."
mode = "read-write"
linux_enforcement = "required"
allow = [
    "~/.claude/",
    "~/.cache/",
    "/tmp/",
    # Standard system read-only paths. Without these the child cannot even
    # resolve its dynamic loader or exec /bin/echo — Landlock and the
    # interposer deny every path outside the root and this allow list. Writable
    # device nodes (/dev/null, /dev/tty) and the readable entropy devices are
    # granted as a baseline in the fence rules, not here (allow entries are
    # read-only, and the baseline covers every device the child needs — see
    # baselineDeviceNodes). /lib, /lib64, /bin and /sbin are symlinks into /usr
    # on usr-merged distros but real directories on musl/Alpine and some embedded
    # systems, where the loader and /bin/sh live outside /usr — grant them so
    # exec works there too.
    #
    # NOT granted, deliberately (N10748 round 2, Gander both lenses + probe):
    #   - "/proc/" exposed /proc/<pid>/environ and cmdline of every same-UID
    #     process, so a wrapped agent could read API keys out of the user's other
    #     shells (yama ptrace_scope does not gate the READ). node startup and
    #     `git status` run without it, so it is pure exposure — dropped.
    #   - "/dev/" made same-user pty slaves (/dev/pts/N) and /dev/shm readable,
    #     letting a wrapped child read another terminal's input. The five baseline
    #     device nodes are granted individually, so the directory grant is not
    #     needed; dropped. A child that truly needs its own /proc/<pid> cannot be
    #     served by a "/proc/self/" narrowing (the Landlock rule binds the
    #     wrapper's pid dir, not the child's) — that would require a private pid
    #     namespace, not an allow entry.
    "/usr/",
    "/lib/",
    "/lib64/",
    "/bin/",
    "/sbin/",
    "/etc/",
    "/sys/",
]
deny = [
    "~/.ssh/",
    "~/.aws/",
    "~/.gnupg/",
    "~/.nock/",
]
hardened = true

[network]
allow = [
    "github.com",
    "api.github.com",
    "api.anthropic.com",
    "registry.npmjs.org",
    "pypi.org",
]
allow_all = false
allow_private_ranges = false

[secrets]
# Claude Code's OWN provider key passes so the agent works for API-key users;
# subscription/OAuth users simply won't have it set (harmless). Every OTHER
# provider's key and all infra secrets stay blocked.
pass = [
    "HOME",
    "PATH",
    "SHELL",
    "USER",
    "LANG",
    "TERM",
    "ANTHROPIC_API_KEY",
]
block = [
    "AWS_*",
    "STRIPE_*",
    "DATABASE_URL",
    "OPENAI_API_KEY",
    "*_SECRET*",
    "*_PASSWORD*",
    "*_TOKEN*",
]

[syscall]
enforcement = "required"
allow_namespaces = false
socket_families = [
    "unix",
    "inet",
    "inet6",
]

[logging]
# Relative: NockLock's audit state directory outside this project. Absolute:
# used verbatim. See the "Event log" section of the README for why.
db = "events.db"
level = "info"

[cloud]
enabled = false
api_key = ""
endpoint = "https://cc.nocktechnologies.io/api/fence/events/"
