[project]
name = "claude-code"
root = "."

[filesystem]
root = "."
mode = "read-write"
linux_enforcement = "required"
allow = [
    "~/.claude/",
    "~/.cache/",
    "/tmp/",
    # Standard system read-only paths. Without these the child cannot even
    # resolve its dynamic loader or exec /bin/echo — Landlock and the
    # interposer deny every path outside the root and this allow list. Writable
    # device nodes (/dev/null, /dev/tty) are granted as a baseline in the fence
    # rules, not here (allow entries are read-only). /lib, /lib64, /bin and
    # /sbin are symlinks into /usr on usr-merged distros but real directories on
    # musl/Alpine and some embedded systems, where the loader and /bin/sh live
    # outside /usr — grant them so exec works there too.
    "/usr/",
    "/lib/",
    "/lib64/",
    "/bin/",
    "/sbin/",
    "/etc/",
    "/sys/",
]
deny = [
    "~/.ssh/",
    "~/.aws/",
    "~/.gnupg/",
    "~/.nock/",
]
hardened = true

[network]
allow = [
    "github.com",
    "api.github.com",
    "api.anthropic.com",
    "registry.npmjs.org",
    "pypi.org",
]
allow_all = false
allow_private_ranges = false

[secrets]
# Claude Code's OWN provider key passes so the agent works for API-key users;
# subscription/OAuth users simply won't have it set (harmless). Every OTHER
# provider's key and all infra secrets stay blocked.
pass = [
    "HOME",
    "PATH",
    "SHELL",
    "USER",
    "LANG",
    "TERM",
    "ANTHROPIC_API_KEY",
]
block = [
    "AWS_*",
    "STRIPE_*",
    "DATABASE_URL",
    "OPENAI_API_KEY",
    "*_SECRET*",
    "*_PASSWORD*",
    "*_TOKEN*",
]

[syscall]
enforcement = "required"
allow_namespaces = false
socket_families = [
    "unix",
    "inet",
    "inet6",
]

[logging]
db = ".nock/events.db"
level = "info"

[cloud]
enabled = false
api_key = ""
endpoint = "https://cc.nocktechnologies.io/api/fence/events/"
