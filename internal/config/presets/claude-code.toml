[project]
name = "claude-code"
root = "."

[filesystem]
root = "."
mode = "read-write"
linux_enforcement = "required"
allow = [
    "~/.claude/",
    "~/.cache/",
    "/tmp/",
    # Node runtime introspection: os.cpus() reads these system-wide,
    # process-independent files (read-only, never a path to another process);
    # without them it silently returns an empty array and mis-sizes worker pools.
    # The child's own /proc/<pid> (for process.memoryUsage) is granted in code,
    # not here — config resolution would follow /proc/self to the wrapper's pid.
    "/proc/cpuinfo",
    "/proc/stat",
    "/proc/meminfo",
]
deny = [
    "~/.ssh/",
    "~/.aws/",
    "~/.gnupg/",
    "~/.nock/",
]
hardened = true

[network]
allow = [
    "github.com",
    "api.github.com",
    "api.anthropic.com",
    "registry.npmjs.org",
    "pypi.org",
]
allow_all = false
allow_private_ranges = false

[secrets]
# Claude Code's OWN provider key passes so the agent works for API-key users;
# subscription/OAuth users simply won't have it set (harmless). Every OTHER
# provider's key and all infra secrets stay blocked.
pass = [
    "HOME",
    "PATH",
    "SHELL",
    "USER",
    "LANG",
    "TERM",
    "ANTHROPIC_API_KEY",
]
block = [
    "AWS_*",
    "STRIPE_*",
    "DATABASE_URL",
    "OPENAI_API_KEY",
    "*_SECRET*",
    "*_PASSWORD*",
    "*_TOKEN*",
]

[syscall]
enforcement = "required"
allow_namespaces = false
socket_families = [
    "unix",
    "inet",
    "inet6",
]

[logging]
db = ".nock/events.db"
level = "info"

[cloud]
enabled = false
api_key = ""
endpoint = "https://cc.nocktechnologies.io/api/fence/events/"
