[project]
name = "gemini-cli"
root = "."

[filesystem]
root = "."
mode = "read-write"
linux_enforcement = "required"
allow = [
    "~/.gemini/",
    "/tmp/",
]
deny = [
    "~/.ssh/",
    "~/.aws/",
    "~/.gnupg/",
    "~/.nock/",
]
hardened = true

[network]
allow = [
    "github.com",
    "api.github.com",
    "generativelanguage.googleapis.com",
    "registry.npmjs.org",
]
allow_all = false
allow_private_ranges = false

[secrets]
# This preset targets Gemini CLI's API-key path. OAuth/Vertex setups need an
# explicit operator review before widening filesystem or egress.
pass = [
    "HOME",
    "PATH",
    "SHELL",
    "USER",
    "LANG",
    "TERM",
    "GEMINI_API_KEY",
]
block = [
    "AWS_*",
    "STRIPE_*",
    "DATABASE_URL",
    "ANTHROPIC_API_KEY",
    "OPENAI_API_KEY",
    "OPENCODE_API_KEY",
    "*_SECRET*",
    "*_PASSWORD*",
    "*_TOKEN*",
]

[syscall]
enforcement = "required"
allow_namespaces = false
socket_families = [
    "unix",
    "inet",
    "inet6",
]

[logging]
# A relative db goes to NockLock's audit state directory OUTSIDE this project
# ($XDG_STATE_HOME/nocklock/<project>), keeping only the filename. The fence
# grants the project root to the agent so it can create files there, and
# Landlock cannot exclude a path beneath a granted directory - so an event log
# stored in the project would be editable by the agent it records. An absolute
# path is used verbatim.
db = "events.db"
level = "info"

[cloud]
enabled = false
api_key = ""
endpoint = "https://cc.nocktechnologies.io/api/fence/events/"
